<!doctype html>
<html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'>
<title>smart-form - Hyper Elements template</title>
<style>body{font-family:Arial,sans-serif;max-width:720px;margin:0 auto;padding:16px;color:#18181b;background:#f4f4f5}
.card{background:#fff;border-radius:8px;padding:16px;margin:12px 0}.mock{background:#fef3c7;padding:8px;border-radius:6px;font-size:14px}
button{padding:10px 14px;border:0;border-radius:6px;background:#111827;color:#fff;font-size:15px}
input,select,textarea{width:100%;padding:9px;margin:4px 0 10px;border:1px solid #d4d4d8;border-radius:6px;font-size:15px}
.chip{display:inline-block;background:#e4e4e7;border-radius:20px;padding:6px 10px;margin:3px;font-size:13px;cursor:pointer}
iframe{width:100%;height:420px;border:1px solid #e4e4e7;border-radius:8px;background:#fff}
#prompt{font-size:16px}</style></head><body>
<h1>&lt;smart-form&gt;</h1>
<p>A Hyper Elements template. Type a prompt, get a form.</p>
<div class='mock'>MOCK: the fields are picked by simple keyword rules, not by an AI model. Nothing is sent anywhere.</div>
<div class='card'><input id='prompt' placeholder='Try: book a table for Friday night'>
<button onclick='build()'>Build my form</button><div id='chips'></div></div>
<div class='card' id='formCard' style='display:none'><h2 id='formTitle'></h2><p id='formDesc'></p><form id='liveForm' onsubmit='return done(event)'></form></div>
<div class='card' id='tplCard' style='display:none'><h2>Hyper Elements template</h2><p>The same form as a printable Hyper Elements page.</p><iframe id='tpl'></iframe></div>
<div class='card' id='doneCard' style='display:none'><b>Demo only, nothing was sent.</b></div>
<script>
const RULES = [{"id":"book-table","keywords":["book","table","restaurant","dinner","reservation","lunch"],"title":"Book a table","description":"Reserve a table at the restaurant.","fields":[{"name":"name","label":"Your name","type":"text","required":true},{"name":"date","label":"Date","type":"date","required":true},{"name":"time","label":"Time","type":"time","required":true},{"name":"guests","label":"Number of guests","type":"number","required":true},{"name":"notes","label":"Anything we should know?","type":"textarea","required":false}]},{"id":"newsletter","keywords":["newsletter","subscribe","sign up","signup","mailing list"],"title":"Newsletter sign-up","description":"Join the mailing list.","fields":[{"name":"name","label":"Your name","type":"text","required":true},{"name":"email","label":"Email address","type":"email","required":true},{"name":"interests","label":"What interests you?","type":"select","options":["Tech","Design","News"],"required":false}]},{"id":"bug-report","keywords":["bug","report","issue","crash","broken","error"],"title":"Report a bug","description":"Tell us what went wrong.","fields":[{"name":"title","label":"Bug title","type":"text","required":true},{"name":"steps","label":"Steps to reproduce","type":"textarea","required":true},{"name":"severity","label":"Severity","type":"select","options":["Low","Medium","High"],"required":true},{"name":"email","label":"Your email","type":"email","required":false}]},{"id":"job-application","keywords":["job","apply","career","vacancy","hiring"],"title":"Job application","description":"Apply for a role.","fields":[{"name":"name","label":"Full name","type":"text","required":true},{"name":"email","label":"Email address","type":"email","required":true},{"name":"portfolio","label":"Portfolio link","type":"url","required":false},{"name":"cover","label":"Cover note","type":"textarea","required":true}]},{"id":"feedback","keywords":["feedback","survey","review","rate"],"title":"Feedback","description":"Tell us what you think.","fields":[{"name":"rating","label":"Rating","type":"select","options":["1","2","3","4","5"],"required":true},{"name":"comments","label":"Your comments","type":"textarea","required":true},{"name":"email","label":"Email (optional)","type":"email","required":false}]},{"id":"contact","keywords":["contact","message","hello","reach"],"title":"Contact us","description":"Send us a message.","fields":[{"name":"name","label":"Your name","type":"text","required":true},{"name":"email","label":"Email address","type":"email","required":true},{"name":"message","label":"Your message","type":"textarea","required":true}]}];
const FALLBACK = {id:'general',title:'General form',description:'A simple form built from your prompt.',fields:[{name:'name',label:'Your name',type:'text',required:true},{name:'email',label:'Email address',type:'email',required:true},{name:'message',label:'Your message',type:'textarea',required:true}]};
const SAMPLES = ['book a table for Friday night','sign up for the newsletter','report a bug in the app','apply for a job','give feedback on the new design','contact the support team'];
var chipsEl = document.getElementById('chips'); SAMPLES.forEach(function(s){ var c = document.createElement('span'); c.className = 'chip'; c.textContent = s; c.onclick = function(){ setPrompt(s); }; chipsEl.appendChild(c); });
function setPrompt(s){document.getElementById('prompt').value=s;build();}
function build(){
  const t = document.getElementById('prompt').value.toLowerCase().trim();
  if(!t){alert('Type a prompt first.');return;}
  const rule = RULES.find(r=>r.keywords.some(k=>t.includes(k))) || FALLBACK;
  document.getElementById('formTitle').textContent = rule.title;
  document.getElementById('formDesc').textContent = rule.description;
  document.getElementById('liveForm').innerHTML = rule.fields.map(f=>{
    if(f.type==='select') return '<label>'+f.label+'</label><select name='+f.name+(f.required?' required':'')+'>'+f.options.map(o=>'<option>'+o+'</option>').join('')+'</select>';
    if(f.type==='textarea') return '<label>'+f.label+'</label><textarea name='+f.name+(f.required?' required':'')+'></textarea>';
    return '<label>'+f.label+'</label><input type='+f.type+' name='+f.name+(f.required?' required':'')+'>';
  }).join('') + '<button type=submit>Submit (demo only)</button>';
  document.getElementById('formCard').style.display='block';
  document.getElementById('tpl').src = 'rendered/'+rule.id+'.html';
  document.getElementById('tplCard').style.display='block';
  document.getElementById('doneCard').style.display='none';
}
function done(e){e.preventDefault();document.getElementById('doneCard').style.display='block';return false;}
</script></body></html>
